<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Weather Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="page-header">
      <div>
        <h1>Portal Meteorológico</h1>
        <p class="hero-subtitle">Clima en tiempo real, alertas y pronóstico extendido en una sola vista.</p>
      </div>
    </header>

    <section id="location-panel" class="search-card">
      <form id="location-form" class="form-grid">
        <div class="field-group">
          <label for="city-select">Ciudad</label>
          <select id="city-select">
            <option value="">Selecciona una ciudad</option>
            <option value="madrid">Madrid</option>
            <option value="barcelona">Barcelona</option>
            <option value="valencia">Valencia</option>
            <option value="sevilla">Sevilla</option>
            <option value="bilbao">Bilbao</option>
            <option value="new york">New York</option>
          </select>
        </div>
        <div class="field-group">
          <label for="lat-input">Latitud</label>
          <input id="lat-input" type="number" step="0.0001" placeholder="40.7128" />
        </div>
        <div class="field-group">
          <label for="lon-input">Longitud</label>
          <input id="lon-input" type="number" step="0.0001" placeholder="-74.0060" />
        </div>
        <div class="action-group">
          <button type="submit" class="primary">Buscar</button>
          <button id="geolocate-button" type="button" class="secondary">Usar geolocalización</button>
        </div>
      </form>
      <div id="location-error" class="error"></div>
      <div id="refresh-info" class="refresh-info"></div>
    </section>

    <div id="weather-dashboard">
      <!-- Weather content -->
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
